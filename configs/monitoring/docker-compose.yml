# NOT DEPLOYED. Draft. Secrets come from .env (see .env.example).
services:
  prometheus:
    image: prom/prometheus:latest
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./alerts.yml:/etc/prometheus/alerts.yml:ro, prom-data:/prometheus]
    ports: ["9090:9090"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:latest
    volumes: [./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro, ./discord_webhook:/etc/alertmanager/discord_webhook:ro]  # discord_webhook is gitignored
    ports: ["9093:9093"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: [grafana-data:/var/lib/grafana]
    ports: ["3001:3000"]
    restart: unless-stopped
  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    environment:
      PVE_USER: ${PVE_USER}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME}
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE}
      PVE_VERIFY_SSL: "false"
    ports: ["9221:9221"]
    restart: unless-stopped
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes: [kuma-data:/app/data]
    ports: ["3002:3001"]
    restart: unless-stopped
volumes: {prom-data: {}, grafana-data: {}, kuma-data: {}}
